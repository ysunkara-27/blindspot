[project]
name = "blindspot"
version = "0.1.0"
description = "Chest X-ray perception trainer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "anthropic>=0.42",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
    "pyarrow>=17",
    "jsonschema>=4.23",
    "tqdm>=4.66",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "torchxrayvision>=0.0.46",
    "scikit-image>=0.24",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
eval = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "pipeline/tests", "backend/app/tests", "eval/tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend", "pipeline", "eval", "shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
