label: fracture
display_name: Fracture
kind: focal
one_liner: A break in a bone; on a chest X-ray this is usually a rib or a clavicle.
key_signs:
  - A break or step in the smooth outline of a rib or clavicle
  - A thin dark line crossing the bone
  - Older breaks show a bulge of new bone (callus) around them
  - Several neighbouring ribs broken in a row
where_it_hides: [right_periphery, left_periphery, right_clavicle, left_clavicle, right_apex, left_apex]
mimics:
  - Normal rib crossings and the gaps between overlapping ribs
  - Costal cartilage joining the front of the ribs
  - The edge of the scapula or a soft tissue line crossing a rib
commonly_confused_with: []
search_tip: Trace the outline of each rib from the spine around to the side, one rib at a time, with the magnifier.
radiopaedia_url: https://radiopaedia.org/articles/rib-fractures
