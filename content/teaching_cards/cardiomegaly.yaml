label: cardiomegaly
display_name: Cardiomegaly
kind: pattern
one_liner: An enlarged heart shadow, judged on a frontal film with the cardiothoracic ratio.
key_signs:
  - Heart width more than half the inner chest width (ratio above 0.5) on a PA film
  - The heart border reaches far toward the side of the chest
  - AP and lying-down films make the heart look bigger, so judge them with care
where_it_hides: [cardiac_silhouette]
mimics:
  - An AP film, which magnifies the heart
  - A shallow breath, which makes the heart look wider
  - A fat pad beside the lower heart border
commonly_confused_with: []
search_tip: Compare the widest heart width with the widest inner chest width before judging heart size.
radiopaedia_url: https://radiopaedia.org/articles/cardiomegaly
