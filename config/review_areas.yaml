# Zone ids always name the PATIENT's side. Patient right is displayed on the image left.
version: 1
zones:
  right_upper_zone:        {human: "right upper zone",            hardness: 0.4}
  right_mid_zone:          {human: "right mid zone",              hardness: 0.3}
  right_lower_zone:        {human: "right lower zone",            hardness: 0.3}
  left_upper_zone:         {human: "left upper zone",             hardness: 0.4}
  left_mid_zone:           {human: "left mid zone",               hardness: 0.3}
  left_lower_zone:         {human: "left lower zone",             hardness: 0.4}
  right_apex:              {human: "right apex",                  hardness: 0.8}
  left_apex:               {human: "left apex",                   hardness: 0.8}
  right_costophrenic_angle: {human: "right costophrenic angle",   hardness: 0.4}
  left_costophrenic_angle:  {human: "left costophrenic angle",    hardness: 0.5}
  right_periphery:         {human: "right lung periphery",        hardness: 0.6}
  left_periphery:          {human: "left lung periphery",         hardness: 0.6}
  right_hilum:             {human: "right hilum",                 hardness: 0.8}
  left_hilum:              {human: "left hilum",                  hardness: 0.8}
  retrocardiac:            {human: "retrocardiac region (behind the heart)", hardness: 1.0}
  cardiac_silhouette:      {human: "cardiac silhouette",          hardness: 0.3}
  mediastinum:             {human: "mediastinum",                 hardness: 0.7}
  subdiaphragmatic:        {human: "area just below the diaphragm", hardness: 0.9}
  right_clavicle:          {human: "right clavicle",              hardness: 0.6}
  left_clavicle:           {human: "left clavicle",               hardness: 0.6}
  spine:                   {human: "spine",                       hardness: 0.6}

# Coverage targets (the classic CXR review areas).
review_areas: [right_apex, left_apex, right_hilum, left_hilum, retrocardiac,
               right_costophrenic_angle, left_costophrenic_angle, subdiaphragmatic, mediastinum]

# Zones that may be named interchangeably by the validator (a debrief may say a neighbor).
adjacency:
  right_upper_zone: [right_apex, right_mid_zone, right_periphery, right_hilum]
  right_mid_zone: [right_upper_zone, right_lower_zone, right_hilum, right_periphery]
  right_lower_zone: [right_mid_zone, right_costophrenic_angle, right_periphery, cardiac_silhouette, subdiaphragmatic]
  left_upper_zone: [left_apex, left_mid_zone, left_periphery, left_hilum]
  left_mid_zone: [left_upper_zone, left_lower_zone, left_hilum, left_periphery]
  left_lower_zone: [left_mid_zone, left_costophrenic_angle, left_periphery, retrocardiac, cardiac_silhouette, subdiaphragmatic]
  right_apex: [right_upper_zone, right_clavicle, right_periphery]
  left_apex: [left_upper_zone, left_clavicle, left_periphery]
  right_hilum: [right_mid_zone, right_upper_zone, mediastinum]
  left_hilum: [left_mid_zone, left_upper_zone, mediastinum]
  retrocardiac: [left_lower_zone, cardiac_silhouette, mediastinum]
  right_costophrenic_angle: [right_lower_zone, right_periphery, subdiaphragmatic]
  left_costophrenic_angle: [left_lower_zone, left_periphery, subdiaphragmatic]
  mediastinum: [right_hilum, left_hilum, cardiac_silhouette, retrocardiac]

# Common normal structures overcalled in each zone. Drafted by the tutor agent (status ai_draft),
# reviewed by Sri, then radiologists. Used only as "possibilities" in overcall explanations.
zone_mimics:
  status: ai_draft
  entries:
    right_upper_zone: [Overlap of the first rib and the clavicle, Costal cartilage of the first rib, Crossing points of the upper ribs]
    left_upper_zone: [Overlap of the first rib and the clavicle, Costal cartilage of the first rib, The normal aortic knob at the edge of the mediastinum]
    right_mid_zone: [Normal vessels seen end-on, Crossing points of ribs, Nipple shadow]
    left_mid_zone: [Normal vessels seen end-on, Crossing points of ribs, Nipple shadow]
    right_lower_zone: [Nipple shadow, Edge of the breast soft tissue, Normal vessels crowded together at the lung base]
    left_lower_zone: [Nipple shadow, Edge of the breast soft tissue, Normal vessels crowded together at the lung base]
    right_apex: [Overlap of the first rib and the clavicle, Costal cartilage of the first rib, Companion shadow running along the upper ribs]
    left_apex: [Overlap of the first rib and the clavicle, Costal cartilage of the first rib, Companion shadow running along the upper ribs]
    right_costophrenic_angle: [Fat or soft tissue filling the angle, Edge of the breast soft tissue, Skin fold]
    left_costophrenic_angle: [Fat or soft tissue filling the angle, Edge of the breast soft tissue, Skin fold]
    right_periphery: [Skin fold, Medial border of the scapula, Edges of overlapping ribs]
    left_periphery: [Skin fold, Medial border of the scapula, Edges of overlapping ribs]
    right_hilum: [Normal pulmonary arteries and veins seen end-on, Vessels crossing over each other, A main airway seen end-on as a ring]
    left_hilum: [Normal pulmonary arteries and veins seen end-on, Vessels crossing over each other, A main airway seen end-on as a ring]
    retrocardiac: [Edge of the normal descending aorta, Spine and the soft tissue beside it, Normal vessels behind the heart]
    cardiac_silhouette: [Fat pad beside the lower heart border, Breast tissue overlying the heart, The normal heart borders]
    mediastinum: [The normal aortic knob, The trachea and main airways, The normal edge of the superior vena cava]
    subdiaphragmatic: [Gas in the stomach or bowel below the diaphragm, Muscle slips of the diaphragm, Overlapping rib edges]
    right_clavicle: [The rhomboid fossa (a normal notch under the clavicle), Overlap of the first rib and the clavicle, Soft tissue at the base of the neck]
    left_clavicle: [The rhomboid fossa (a normal notch under the clavicle), Overlap of the first rib and the clavicle, Soft tissue at the base of the neck]
    spine: [Overlapping edges of the vertebrae, The normal line of soft tissue beside the spine, Air in the trachea over the spine]

# ---------------------------------------------------------------------------------------------
# Volumetric zones (CT / MR). Zone ids name the PATIENT's side. Derived per case from the organ labels in the
# reference mask plus the slab's extent: thirds along z (superior/mid/inferior) × left/right/midline.
volumetric:
  zones:
    pancreas:            {human: "pancreas",                     hardness: 0.6, modality: ct, body_region: abdomen}
    liver:               {human: "liver",                        hardness: 0.5, modality: ct, body_region: abdomen}
    hepatic_vessels:     {human: "hepatic vessels",              hardness: 0.7, modality: ct, body_region: abdomen}
    superior_slab:       {human: "upper slices of the volume",   hardness: 0.5}
    mid_slab:            {human: "middle slices of the volume",  hardness: 0.3}
    inferior_slab:       {human: "lower slices of the volume",   hardness: 0.5}
    right_half:          {human: "patient's right side",         hardness: 0.3}
    left_half:           {human: "patient's left side",          hardness: 0.3}
    midline_volume:      {human: "midline",                      hardness: 0.4}
    brain_left:          {human: "left cerebral hemisphere",     hardness: 0.4, modality: mr, body_region: brain}
    brain_right:         {human: "right cerebral hemisphere",    hardness: 0.4, modality: mr, body_region: brain}
    brain_midline:       {human: "midline structures",           hardness: 0.6, modality: mr, body_region: brain}
  # Coverage targets per body region: the organ (when labelled) and every third of the slab.
  review_areas:
    abdomen: [pancreas, liver, superior_slab, mid_slab, inferior_slab]
    chest:   [superior_slab, mid_slab, inferior_slab]
    brain:   [brain_left, brain_right, superior_slab, mid_slab, inferior_slab]
  adjacency:
    superior_slab: [mid_slab]
    mid_slab: [superior_slab, inferior_slab]
    inferior_slab: [mid_slab]
    pancreas: [mid_slab, inferior_slab, midline_volume]
    liver: [superior_slab, mid_slab, right_half]
    hepatic_vessels: [liver]
    brain_left: [brain_midline]
    brain_right: [brain_midline]
  zone_mimics:
    status: ai_draft
    entries:
      pancreas: [Unopacified bowel loops next to the pancreas, The splenic vein running along the pancreas, Normal lobulated pancreatic contour]
      liver: [Hepatic veins and portal branches (tubular, branching), Focal fat next to the falciform ligament, Beam-hardening streaks from ribs]
      hepatic_vessels: [Portal and hepatic veins seen end-on, Mixing of contrast in the hepatic veins]
      brain_left: [Normal sulci and cortical gyri, Choroid plexus and calcified pineal]
      brain_right: [Normal sulci and cortical gyri, Choroid plexus and calcified pineal]
      brain_midline: [Normal ventricles, Septum pellucidum, Falx and tentorium]
      superior_slab: [Partial-volume effect at the top of an organ (looks like a lesion on one slice only), Vessels crossing the slice obliquely]
      mid_slab: [Vessels seen end-on (round, follow them across slices), Unopacified bowel loops]
      inferior_slab: [Partial-volume effect at the bottom of an organ, Bowel loops and their contents]
      right_half: [Vessels seen end-on, Partial-volume effect at organ edges]
      left_half: [Vessels seen end-on, Partial-volume effect at organ edges]
      midline_volume: [Normal vessels and ducts crossing the midline, The spine and paraspinal muscles]
