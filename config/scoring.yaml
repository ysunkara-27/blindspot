version: 1
hit:
  tolerance_frac: 0.02        # τ = 0.02·W ≈ 20 px at 1024
roi:
  roi_frac: 0.035             # ρ = 0.035·W ≈ 36 px: dilation of finding mask for dwell
dwell:
  max_dt_ms: 250              # cap per sample interval
  max_still_ms: 1500          # idle cap for a stationary pointer
  zoom_dwell_min: 2.0         # viewport-centre dwell counts at ≥ 2× zoom
  zoom_dwell_weight: 0.5
  visit_ms: 300               # review area counts as visited at ≥ 300 ms
miss_types:                   # Kundel taxonomy (proxy): search < recognition_ms ≤ recognition < decision_ms ≤ decision
  recognition_ms: 300
  decision_ms: 1000
matching_costs:
  exact: 0.0
  related: 0.3
  other: 0.6
  no_hit: 1000000
score_weights:
  abnormal: {localization: 70, label: 20, pattern: 10, false_positive: -10, hint: 0}   # hints are free (user feedback Oct 6): UI says "3 hints left"
  normal:   {base: 100, false_positive: -25, hint: 0}
success:
  abnormal_max_false_positives: 1
hints:
  max_per_case: 3
validator:
  headline_max_words: 14
  total_max_words: 160
  total_limit_base_findings: 8   # above this many findings the word limit grows
  words_per_extra_finding: 6
  banned_patterns: ["\\btreat(ment|ed|ing)?\\b", "\\bmanage(ment)?\\b", "\\bantibiotic", "\\bchest tube\\b", "\\bdrain(age)?\\b",
                    "\\bbiopsy\\b", "\\badmit\\b", "\\burgent", "\\bfollow-?up (ct|imaging|scan)\\b", "\\bthis patient (has|should)\\b",
                    "\\b\\d+(\\.\\d+)?\\s?(cm|mm)\\b"]
submit:
  max_marks: 50

# ---------------------------------------------------------------------------------------------
# Volumetric (CT / MR) grading — see docs/VOLUMETRIC_PLAN.md
volumetric:
  hit:
    tolerance_frac: 0.02           # of the larger in-plane field-of-view dimension (mm)
    slice_window: 2                # a mark within ±2 slices of the finding still counts
    cross_label_rescue: false      # a mark squarely inside a DIFFERENT labelled structure is never rescued by the tolerance
  dwell:
    slice_search_ms: 800           # finding's slices on screen < 800 ms total → missed_search
    slice_recognition_ms: 2000     # ≥ 800 and < 2000 ms, cursor never near it → missed_recognition; else decision
    near_mm: 15                    # "cursor near it" = within 15 mm in-plane on a finding slice
    visit_ms: 300                  # a zone counts as visited at ≥ 300 ms of its slices on screen with the cursor in it
  size:
    tolerance_mm: 3
    tolerance_frac: 0.20           # the greater of 3 mm or 20 % is correct
    ask_for_labels: [pancreatic_tumour, liver_tumour, brain_tumour, lung_tumour, colon_tumour]
  unmatched:
    note: "A mark that matches no reference label is reported as 'unmatched' (the reference does not label every lesion), not as a false positive, and does not reduce the score."
